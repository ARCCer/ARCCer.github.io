  # Updated from the supplied September 13, 2026 manuscript.
  - title: "Talk the Talk and Walk the Walk: An Empirical Study of Front-Office Communication and Back-Office Problem Solving Under Workload Pressure"
    previous_title: "Managing Front-office and Back-office Effort Allocation: Unpacking the Effects of Workload on Service Performance"
    manuscript_date: "2026-09-13"
    authors:
      - name: "[Chuan Zhu, Tom Fangyun Tan, Tianjun Feng]"
    status: "Working paper"
    target_or_current_venue: "[TODO]"

    research_question:
      primary_research_question: "How does workload change agents' within-session allocation between front-office communication and back-office problem solving, how does this allocation mediate service performance, and what mechanisms explain these relationships?"

    setting_or_context: "After-sales live-chat customer service at a large Chinese e-commerce platform, combining service records, agent clickstream activities, and customer-agent transcripts from October 25 to November 30, 2023."
    sample:
      full_sessions: 4683611
      analyzed_sessions: 3965028
      agents: 7004
      notes: "The main sample excludes sessions with fewer than three interaction rounds; customer-rating models use the rated-session subsample."

    methods:
      - "Session-level fixed-effects models using service records, clickstream data, and chat transcripts"
      - "Control-function estimation with instrumental variables for workload and effort allocation"
      - "Nonlinear mediation analysis and counterfactual analysis"
      - "LDA-based measures of problem-centeredness and LLM-based measures of interaction quality"

    main_contribution: "Identifies within-session effort composition as a behavioral mechanism linking workload to service performance, shows that the front-office/back-office boundary changes with workload, and identifies effort rebalancing as an operational lever within existing staffing capacity."

    abstract_short: "Using 3,965,028 analyzed sessions handled by 7,004 agents, this paper examines how workload changes the share of active service effort devoted to front-office communication. Workload has a U-shaped relationship with this front ratio, with a turning point near 3.21 concurrent sessions. The effort-allocation pathway accounts for 14.19%, 15.92%, and 24.78% of workload's combined absolute marginal effects on session duration, customer ratings, and retrials, respectively. Textual analyses distinguish the interaction-enabling benefits of moderate front-office effort from the crowding out of substantive problem solving at excessive levels. Counterfactual estimates suggest that raising the front ratio from 0.47 to approximately 0.53 could reduce duration by 2.52%, increase ratings by 2.26%, and reduce retrials by 0.77% without additional capacity."

    cv_summary:
      - "Examines how workload shifts effort between customer communication and back-office problem solving, using 3,965,028 live-chat sessions handled by 7,004 agents at a large Chinese e-commerce platform."
      - "Combines clickstream and transcript data with instrumental-variable control-function estimation, nonlinear mediation analysis, and LDA- and LLM-based textual measures."
      - "Finds a U-shaped relationship between workload and the share of effort devoted to communication; counterfactual estimates suggest that rebalancing effort can shorten sessions, improve customer ratings, and reduce retrials without adding capacity."

